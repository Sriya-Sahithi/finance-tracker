spring:
  application:
    name: finance-tracker
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: Asia/Kolkata
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  forward-headers-strategy: framework

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-not-for-production-32}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  encryption:
    key: ${ENCRYPTION_KEY:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  timezone: Asia/Kolkata
  currency: INR

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

info:
  app:
    name: finance-tracker

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
