spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finance_tracker}
    username: ${DB_USERNAME:finance}
    password: ${DB_PASSWORD:finance}
  jpa:
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-not-for-production-32}

logging:
  level:
    com.financetracker: INFO
    org.hibernate.SQL: WARN
